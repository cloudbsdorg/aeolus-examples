# FreeBSD 16 — PostgreSQL 17
# Category: data
version: "1.0"
name: aeolus-postgresql17
namespace: demo

volumes:
  - name: data
    pool: zfs/aeolus/postgresql17
    path: /var/aeolus/ensembles/postgresql17/data

services:
  - name: postgresql17
    image: oci.cloudbsd.org/aeolus-postgresql17:16
    replicas: 1
    ports: ["5432:5432"]
    volumes: [data]
