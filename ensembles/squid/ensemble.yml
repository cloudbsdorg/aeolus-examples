# FreeBSD 16 — Caching forward proxy
# Category: edge
version: "1.0"
name: aeolus-squid
namespace: demo

volumes:
  - name: data
    pool: zfs/aeolus/squid
    path: /var/aeolus/ensembles/squid/data

services:
  - name: squid
    image: docker.io/cloudbsd/aeolus-squid:16
    replicas: 1
    ports: ["3128:3128"]
    volumes: [data]
